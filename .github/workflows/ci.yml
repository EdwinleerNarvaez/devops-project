name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Build imagen Docker
        run: docker build -t devops-project .

      - name: Instalar dependencias y correr tests
        run: |
          pip install -r app/requirements.txt
          cd app && pytest test_app.py -v

      - name: Test app en contenedor
        run: |
          docker run -d -p 5000:5000 --name test-app devops-project
          sleep 5
          curl http://localhost:5000/health
          docker stop test-app
          docker rm test-app

      - name: Escaneo de seguridad con Snyk
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: devops-project
          args: --severity-threshold=high
        continue-on-error: true

      - name: Escaneo de seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-project
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Generar SBOM con CycloneDX
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements app/requirements.txt -o sbom.xml
          cat sbom.xml

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml

      - name: Deploy a EC2
        if: github.ref == 'refs/heads/main'
        env:
          EC2_HOST: 54.208.17.145
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@$EC2_HOST '
            sudo docker stop devops-app || true
            sudo docker rm devops-app || true
          '
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r ./app ./Dockerfile ubuntu@$EC2_HOST:~/devops-project/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@$EC2_HOST '
            cd ~/devops-project
            sudo docker build -t devops-project .
            sudo docker run -d -p 5000:5000 --name devops-app devops-project
          '
